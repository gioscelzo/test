<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>CIAO FRA!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #0d0d0d;
        }

        body {
            color: #eeeeee;
            font-family: "Courier New", monospace;

            overflow: hidden;

            -webkit-tap-highlight-color: transparent;
        }

        /* ==============================
           TERMINALE
           ============================== */

        .terminal {
            width: 100%;
            height: 100dvh;

            background: #111111;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* ==============================
           TOP BAR
           ============================== */

        .topbar {
            height: 42px;
            min-height: 42px;

            background: #202020;

            display: flex;
            align-items: center;

            padding-left: 14px;
            gap: 8px;

            padding-top: env(safe-area-inset-top);
        }

        .dot {
            width: 11px;
            height: 11px;

            border-radius: 50%;
        }

        .red {
            background: #ff5f57;
        }

        .yellow {
            background: #febc2e;
        }

        .green {
            background: #28c840;
        }


        /* ==============================
           CHAT
           ============================== */

        #terminal {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding:
                24px
                20px
                30px;

            white-space: pre-wrap;
            word-break: break-word;

            font-size: 16px;
            line-height: 1.6;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: thin;
            scrollbar-color: #444 transparent;
        }

        .line {
            margin-bottom: 14px;
        }

        .bot {
            color: #eeeeee;
        }

        .user {
            color: #62e884;
        }

        .code {
            color: #999999;

            padding-left: 10px;

            font-size: 14px;
            line-height: 1.5;
        }


        /* ==============================
           INPUT
           ============================== */

        .input-container {
            flex-shrink: 0;

            display: flex;
            align-items: center;

            min-height: 62px;

            padding:
                10px
                18px
                calc(10px + env(safe-area-inset-bottom));

            background: #151515;

            border-top: 1px solid #292929;
        }

        .prompt {
            flex-shrink: 0;

            color: #62e884;

            font-size: 18px;
            font-weight: bold;

            margin-right: 8px;
        }

        #input {
            width: 100%;
            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            color: #62e884;

            font-family: "Courier New", monospace;
            font-size: 17px;

            padding: 6px 0;

            caret-color: #62e884;

            -webkit-appearance: none;
            appearance: none;
        }

        #input::selection {
            background: #285c38;
        }

        .hidden {
            display: none;
        }


        /* ==============================
           DESKTOP
           ============================== */

        @media (min-width: 700px) {

            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .terminal {
                width: min(850px, 94vw);
                height: min(700px, 90vh);

                border: 1px solid #333;
                border-radius: 10px;

                box-shadow:
                    0 20px 60px rgba(0, 0, 0, 0.6);
            }

            #terminal {
                padding: 25px;

                font-size: 16px;
            }

            .input-container {
                padding:
                    14px
                    25px;
            }
        }


        /* ==============================
           SCHERMI MOLTO PICCOLI
           ============================== */

        @media (max-width: 360px) {

            #terminal {
                padding: 20px 16px 25px;

                font-size: 15px;
                line-height: 1.55;
            }

            .line {
                margin-bottom: 12px;
            }

            .code {
                font-size: 13px;
            }

            #input {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="terminal">

    <div class="topbar">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
    </div>

    <div id="terminal"></div>

    <div id="input-container" class="input-container hidden">
        <span class="prompt">&gt;</span>

        <input
            id="input"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
        >
    </div>

</div>


<script>

    const terminal =
        document.getElementById("terminal");

    const inputContainer =
        document.getElementById("input-container");

    const input =
        document.getElementById("input");


    const massiveDelay = 3500;
    const longDelay = 2500;
    const shortDelay = 1500;


    let waitingForInput = false;
    let resolveInput = null;


    /* ==============================
       UTILITY
       ============================== */

    function sleep(ms) {
        return new Promise(resolve =>
            setTimeout(resolve, ms)
        );
    }


    function scrollToBottom() {
        requestAnimationFrame(() => {
            terminal.scrollTop =
                terminal.scrollHeight;
        });
    }


    function print(text, className = "bot") {

        const line =
            document.createElement("div");

        line.className =
            "line " + className;

        line.textContent = text;

        terminal.appendChild(line);

        scrollToBottom();
    }


    function printCode(text) {

        const line =
            document.createElement("div");

        line.className =
            "line code";

        line.textContent = text;

        terminal.appendChild(line);

        scrollToBottom();
    }


    /* ==============================
       INPUT
       ============================== */

    async function getInput() {

        waitingForInput = true;

        inputContainer.classList.remove(
            "hidden"
        );

        input.value = "";

        /*
         * Piccolo ritardo:
         * permette al browser di mostrare
         * correttamente la barra di input
         * prima di aprire la tastiera.
         */
        await sleep(50);

        input.focus();

        return new Promise(resolve => {

            resolveInput = resolve;

        });
    }


    function submitInput() {

        if (
            !waitingForInput ||
            !resolveInput
        ) {
            return;
        }

        const value =
            input.value.trim();

        if (value === "") {
            return;
        }

        waitingForInput = false;

        inputContainer.classList.add(
            "hidden"
        );

        print(value, "user");

        const resolve =
            resolveInput;

        resolveInput = null;

        resolve(value);
    }


    input.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                event.preventDefault();

                submitInput();
            }
        }
    );


    /* ==============================
       PROGRAMMA
       ============================== */

    async function program() {

        print("CIAO FRA!");

        await sleep(longDelay);


        print(
            "Come stai? [Bene/Male]"
        );

        await getInput();


        print(
            "Dai, sono contenta"
        );

        await sleep(shortDelay);


        print(
            "Il messaggio non cambiava " +
            "in base alla risposta, " +
            "non ho ancora imparato gli if. " +
            "Guarda il codice"
        );

        await sleep(longDelay);


        printCode(
            'input("Come stai? [Bene/Male]")'
        );

        printCode(
            'print("Dai, sono contenta")'
        );


        await sleep(massiveDelay);


        print(
            "Vuoi picchiarmi eh?"
        );

        await sleep(longDelay);


        print(
            "Comunque..."
        );

        await sleep(shortDelay);


        print(
            "...ti volevo chiedere..."
        );

        await sleep(shortDelay);


        print(
            "...ti andrebbe di uscire?"
        );

        await sleep(longDelay);


        /* ==============================
           PRIMA DOMANDA
           ============================== */

        while (true) {

            print(
                'Valuta bene la risposta. ' +
                'Puoi inserire "SI" o "NO". ' +
                'Prova ad inserire NO ->'
            );

            const response =
                await getInput();


            if (
                response === "NO" ||
                response === "no" ||
                response === "No"
            ) {

                break;
            }


            print(
                "Hey, non barare!"
            );
        }


        print(
            "No, questa risposta non va bene"
        );

        await sleep(longDelay);


        print(
            "Ok, scherzavo. " +
            "Ora seriamente, ti va di uscire?"
        );


        /* ==============================
           SECONDA DOMANDA
           ============================== */

        while (true) {

            const response =
                await getInput();


            if (
                response === "SI" ||
                response === "Si" ||
                response === "si"
            ) {

                break;
            }


            print(
                "Questa risposta non va bene. " +
                "Riprova "
            );
        }


        print(
            "OK! Va facciamo martedì? " +
            "o martedì prossimo? " +
            "Ritorna in chat però, " +
            "non ho più risposte... :("
        );
    }


    /* ==============================
       AVVIO
       ============================== */

    program();

</script>

</body>
</html>
